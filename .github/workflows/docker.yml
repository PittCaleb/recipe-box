name: Docker image

# Builds the image on every push to main and publishes it to GitHub
# Container Registry as ghcr.io/pittcaleb/recipe-box:latest, which the NAS
# pulls. The NAS (QNAP TS-464) is x86-64, so one amd64 build is enough.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64
          push: true
          tags: |
            ghcr.io/pittcaleb/recipe-box:latest
            ghcr.io/pittcaleb/recipe-box:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
